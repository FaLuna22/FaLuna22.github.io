<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Case-tracking flow"><rect width="1200" height="750" fill="#faf8f5"/><text x="50" y="80" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="44" fill="#1c1917" text-anchor="start" font-weight="600">Case tracking in the office</text><text x="50" y="124" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="28" fill="#78716c" text-anchor="start" font-weight="400">Every request, from intake to reply</text><rect x="50" y="220" width="200" height="270" rx="14" fill="#fff" stroke="#9b1c31" stroke-width="2"/><text x="72" y="272" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#9b1c31" text-anchor="start" font-weight="600">01</text><text x="72" y="330" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="32" fill="#1c1917" text-anchor="start" font-weight="600">Intake</text><text x="72" y="390" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#78716c" text-anchor="start" font-weight="400">documents,</text><text x="72" y="422" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#78716c" text-anchor="start" font-weight="400">email, visits</text><path d="M254 355 l20 0 m-9 -8 l9 8 l-9 8" fill="none" stroke="#78716c" stroke-width="2.5"/><rect x="278" y="220" width="200" height="270" rx="14" fill="#9b1c31" stroke="#9b1c31" stroke-width="2"/><text x="300" y="272" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#faf8f5" text-anchor="start" font-weight="600">02</text><text x="300" y="330" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="32" fill="#faf8f5" text-anchor="start" font-weight="600">Summary</text><text x="300" y="390" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#faf8f5" text-anchor="start" font-weight="400">classify &amp;</text><text x="300" y="422" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#faf8f5" text-anchor="start" font-weight="400">prioritize</text><path d="M482 355 l20 0 m-9 -8 l9 8 l-9 8" fill="none" stroke="#78716c" stroke-width="2.5"/><rect x="506" y="220" width="200" height="270" rx="14" fill="#fff" stroke="#9b1c31" stroke-width="2"/><text x="528" y="272" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#9b1c31" text-anchor="start" font-weight="600">03</text><text x="528" y="330" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="32" fill="#1c1917" text-anchor="start" font-weight="600">Letter</text><text x="528" y="390" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#78716c" text-anchor="start" font-weight="400">information</text><text x="528" y="422" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#78716c" text-anchor="start" font-weight="400">request</text><path d="M710 355 l20 0 m-9 -8 l9 8 l-9 8" fill="none" stroke="#78716c" stroke-width="2.5"/><rect x="734" y="220" width="200" height="270" rx="14" fill="#9b1c31" stroke="#9b1c31" stroke-width="2"/><text x="756" y="272" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#faf8f5" text-anchor="start" font-weight="600">04</text><text x="756" y="330" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="32" fill="#faf8f5" text-anchor="start" font-weight="600">Deadline</text><text x="756" y="390" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#faf8f5" text-anchor="start" font-weight="400">tracking &amp;</text><text x="756" y="422" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#faf8f5" text-anchor="start" font-weight="400">reminders</text><path d="M938 355 l20 0 m-9 -8 l9 8 l-9 8" fill="none" stroke="#78716c" stroke-width="2.5"/><rect x="962" y="220" width="200" height="270" rx="14" fill="#fff" stroke="#9b1c31" stroke-width="2"/><text x="984" y="272" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#9b1c31" text-anchor="start" font-weight="600">05</text><text x="984" y="330" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="32" fill="#1c1917" text-anchor="start" font-weight="600">Reply</text><text x="984" y="390" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#78716c" text-anchor="start" font-weight="400">answer &amp;</text><text x="984" y="422" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" fill="#78716c" text-anchor="start" font-weight="400">report</text><text x="50" y="600" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="27" fill="#78716c" text-anchor="start" font-weight="400">Automated with Claude Code: summaries, letters,</text><text x="50" y="642" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="27" fill="#78716c" text-anchor="start" font-weight="400">hearing reports and a tracking portal.</text></svg>